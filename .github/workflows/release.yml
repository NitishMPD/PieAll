name: Windows release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

# Shared across branches and manual runs; the publish script also checks latest's version.
concurrency:
  group: pieall-windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'NitishMPD/PieAll' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PIEALL_TAURI_PUBLIC_KEY: ${{ vars.PIEALL_TAURI_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.12.10
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.92.0
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Check signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (!$env:PIEALL_TAURI_PUBLIC_KEY -or !$env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure the dedicated PieAll public-key variable and private-key secret before releasing.' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - run: node --test scripts/release-version.test.cjs scripts/release-artifacts.test.cjs
      - run: node scripts/release-version.cjs --check
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked --features release-tools
      - run: cargo clippy --workspace --all-targets --locked --features release-tools -- -D warnings
      - run: cargo test -p pieall --locked --lib
      - run: cargo test -p pieall-desktop --locked --bin pieall-desktop shell::tests
      - run: cargo test -p pieall-desktop --locked --features release-tools --bin release-verify
      - name: Set automatic version
        run: node scripts/release-version.cjs
      - name: Create or resume release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release.cjs draft
      - name: Build signed installer and portable ZIP, then verify both
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/package-release.ps1 -NotesFile .release/release-notes.txt
      - name: Upload to draft, download and verify every asset, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release.cjs publish
