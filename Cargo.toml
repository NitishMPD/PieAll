[package]
name = "pieall"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
minisign-verify = "=0.3.0"
semver = "=1.0.28"
ureq = { version = "=3.4.2", default-features = false, features = ["native-tls"] }
tempfile = "=3.27.0"

windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Ole", "Win32_System_Variant"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_Security"] }

[profile.release]
lto = "thin"
strip = "debuginfo"


